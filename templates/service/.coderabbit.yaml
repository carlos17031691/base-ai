# CodeRabbit configuration for base-ai service
# Reference: https://docs.coderabbit.ai/
language: "en"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "development"

  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!.git/**"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!yarn.lock"

  path_instructions:
    - path: "**/*"
      instructions: |
        You are reviewing a Pull Request for an independent service created via `base-ai`.
        Enforce the following non-negotiable engineering rules:
        
        1. TRACEABILITY & BRANCHING:
           - Every PR title and commit MUST contain a valid Ticket ID (e.g. `PROJ-123`, `FIN-101`, `#45`).
           - All feature/fix PRs MUST target `development`. Flag any feature PR opened against `main`.
        
        2. SERVICE ISOLATION:
           - This service is an independent repository. It MUST NEVER import from `../../` or sibling services.
           - All communication with external services must use versioned contracts (OpenAPI, gRPC, event schemas).
        
        3. SECURITY BY DESIGN (OWASP / STRIDE):
           - Zero secrets, tokens, or PII in code, tests, docs, or logs.
           - Validate all inputs at the boundary using strict schemas (e.g. Zod, Joi, Pydantic).
           - Parameterize all SQL/NoSQL queries; never interpolate untrusted strings into commands or queries.
        
        4. CLEAN CODE & RESILIENCE:
           - Isolate domain logic from transport/infrastructure (Dependency Inversion).
           - Outbound integrations (APIs, webhooks, LLMs) MUST have explicit timeouts, retries with backoff+jitter, and error handling.
           - Fail fast on bugs; return typed domain errors; never swallow exceptions.
        
        5. SEVERITY CLASSIFICATION & HUMAN APPROVAL:
           - You MUST explicitly classify every review finding into one of three severities: [High], [Medium], or [Low].
           - [High]: Critical bugs, security vulnerabilities (OWASP/STRIDE), architectural boundary violations, data loss, breaking contract changes. These are BLOCKERS and must be fixed before human approval.
           - [Medium]: Missing test coverage (<80%), unhandled error paths, cognitive complexity, race conditions, code smells. These are BLOCKERS and must be fixed before human approval.
           - [Low]: Non-blocking improvements, minor naming polish, or non-urgent refactoring. Remind the author and reviewer that Low findings may only be approved without code changes if logged as an explicit Technical Debt Issue.
           - Remind the author that all PR merges require final human sign-off; automated checks are pre-conditions for human approval.
