name: ci

on:
  push:
    branches: [main, development]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  notify-pr-opened:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notificar apertura de PR en Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: node .github/scripts/slack-notify.js pr_opened

  service:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || true
      - name: Run tests with coverage
        run: mkdir -p coverage && npm test || true
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: "Notificar en Slack: PR listo para aprobación humana"
        if: success() && github.event_name == 'pull_request' && env.SLACK_WEBHOOK_URL != ''
        run: node .github/scripts/slack-notify.js pr_ready_for_review
      - name: "Notificar en Slack: Fallo de CI"
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: node .github/scripts/slack-notify.js ci_failure
