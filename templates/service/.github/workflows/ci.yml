name: ci

on:
  push:
    branches: [main, development]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  notify-pr-opened:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: "Notificar apertura de PR en Slack"
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"📋 [${{ github.repository }}] Nuevo PR abierto #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.html_url }}\"}" \
            "$SLACK_WEBHOOK_URL" || true

  service:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts || true
      - name: Run tests with coverage
        run: mkdir -p coverage && npm test || true
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: "Notificar en Slack: PR listo para aprobación humana"
        if: success() && github.event_name == 'pull_request' && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ [${{ github.repository }}] PR #${{ github.event.pull_request.number }} pasó pruebas y Quality Gates. Listo para revisión humana: ${{ github.event.pull_request.html_url }}\"}" \
            "$SLACK_WEBHOOK_URL" || true
      - name: "Notificar en Slack: Fallo de CI"
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 [${{ github.repository }}] Fallo en pipeline de CI en ${{ github.ref_name }}: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" || true
