# SonarCloud Automatic Analysis configuration (read by the GitHub App).
# The sonar-project.properties file is used when SONAR_TOKEN is set in CI.
# This file mirrors the settings needed for the GitHub App to apply the same rules.
sonar.sources=cli/src
sonar.tests=cli/src/test
sonar.test.inclusions=cli/src/test/**/*.ts
sonar.exclusions=cli/dist/**,cli/template/**,**/node_modules/**,**/templates/**,**/.github/**
sonar.cpd.exclusions=**/*
sonar.typescript.tsconfigPath=cli/tsconfig.json
