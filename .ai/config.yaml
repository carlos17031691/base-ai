# Single AI source configuration (see ADR-0001)
version: 1
lang: en
agents:
  - antigravity
  - claude
  - cursor
  - copilot
  - codex
budgets:
  definitions:
    implementer: 3250
    improvement: 8000
    planner: 1500
    qa: 14500
    reviewer: 6000
    supervisor: 8750
  definition_totals:
    qa: 18250
    reviewer: 7000
    supervisor: 11250
# Token usage (BASE-101-U2). `base-ai ai sync` writes (claude-code) or removes (none) the marked
# SubagentStop/Stop hook of .claude/settings.json; absent means none. `init` sets none in new projects.
usage:
  hook: claude-code
  # USD per million tokens, keyed by the exact model id of the records; all four keys are required.
  # No default prices: a model with no entry shows "no price", never 0. Example only; copy your
  # provider's current prices and the model id exactly as the records show it (no aliases, no prefixes):
  # pricing:
  #   claude-sonnet-4-5-20250929:
  #     input: 3
  #     cache_write: 3.75
  #     cache_read: 0.3
  #     output: 15
# Pipeline HUD (BASE-101-D2). The "open" link template of `base-ai dashboard`, read once at start;
# absent means vscode://file/{path}. {path} appears exactly once and becomes the file's absolute path,
# with leading slashes dropped. At most 200 characters; javascript, data, vbscript, blob, file, http and
# https schemes are refused. Example only:
# dashboard:
#   editor_url: "vscode://file/{path}"
