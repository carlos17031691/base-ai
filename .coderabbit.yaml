# CodeRabbit configuration for base-ai umbrella repository
# Reference: https://docs.coderabbit.ai/
language: "en"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "development"

  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!cli/dist/**"
    - "!cli/template/**"
    - "!.git/**"
    - "!package-lock.json"
    - "!cli/package-lock.json"

  path_instructions:
    - path: "**/*"
      instructions: |
        You are reviewing a Pull Request in a project governed by `base-ai` engineering standards (ADR-0001, ADR-0002).
        Enforce the following non-negotiable rules:
        
        1. TRACEABILITY & SDLC GATES:
           - Every PR and commit MUST reference a valid Ticket/Issue ID (e.g. `PROJ-123`, `BASE-123`, `#45`).
           - Working branches MUST target `development` (staging). Only release promotion PRs (`development` -> `main`) target `main`. Flag any feature PR opened directly against `main`.
        
        2. ISOLATION BOUNDARIES:
           - Root repository is an umbrella with NO application code.
           - Services in `src/<name>` must be completely independent repositories. Flag any cross-service filesystem imports (`../other-service`) or imports from root.
        
        3. SECURITY BY DESIGN (OWASP):
           - Zero hardcoded secrets, API keys, tokens, or PII. Flag any unredacted credential immediately as CRITICAL.
           - All external inputs (CLI, HTTP, files, webhooks) must be strictly validated at boundaries.
        
        4. CLEAN CODE & ARCHITECTURE:
           - Apply SOLID, KISS, YAGNI, and pragmatic DRY.
           - Prefer small cohesive functions, strict types, guard clauses, and immutable data structures.
           - Never swallow errors silently or use untyped `any` without strong justification.
        
        5. SEVERITY CLASSIFICATION, CONVERSATION RESOLUTION & HUMAN APPROVAL:
           - You MUST explicitly classify every review finding into one of three severities: [High], [Medium], or [Low].
           - [High]: Critical bugs, security vulnerabilities (OWASP/STRIDE), architectural boundary violations, data loss, breaking contract changes. These are BLOCKERS and must be fixed before human approval.
           - [Medium]: Missing test coverage (<80%), unhandled error paths, cognitive complexity, race conditions, code smells. These are BLOCKERS and must be fixed before human approval.
           - [Low]: Non-blocking improvements, minor naming polish, or non-urgent refactoring. Remind the author and reviewer that Low findings may only be approved without code changes if logged as an explicit Technical Debt Issue.
           - ZERO UNRESOLVED DISCUSSIONS: Remind the author that all review comments and conversation threads must be verified and marked resolved before merge.
           - MANDATORY HUMAN APPROVAL: Remind the author that all PR merges require final human sign-off; automated checks are pre-conditions for human approval.
