name: ci

on:
  push:
    branches: [main, development]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  notify-pr-opened:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notificar apertura de PR en Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: node .github/scripts/slack-notify.js pr_opened

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - name: Run tests with coverage
        run: mkdir -p coverage && npm run build && node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info --test-reporter=spec --test-reporter-destination=stdout dist/test/
      - name: Artefactos de IA sincronizados con .ai/
        run: node dist/index.js doctor --root ..
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: "Notificar en Slack: PR listo para aprobación humana"
        if: success() && github.event_name == 'pull_request' && env.SLACK_WEBHOOK_URL != ''
        run: node ../.github/scripts/slack-notify.js pr_ready_for_review
      - name: "Notificar en Slack: Fallo de CI"
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: node ../.github/scripts/slack-notify.js ci_failure
