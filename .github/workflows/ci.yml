name: ci

on:
  push:
    branches: [main, development]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  notify-pr-opened:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notificar apertura de PR en Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: node .github/scripts/slack-notify.js pr_opened

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - name: Run tests with coverage
        run: mkdir -p coverage && npm run build && node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info --test-reporter=spec --test-reporter-destination=stdout dist/test/
      - name: Artefactos de IA sincronizados con .ai/
        run: node dist/index.js doctor --root ..
      - name: Package ships every referenced file (BASE-046-D1)
        run: npm run check:package
      - name: Dependency audit (High/Critical, production dependencies)
        env:
          OSV_SCANNER_VERSION: "2.7.1"
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          : > "$RUNNER_TEMP/osv-scanner-empty.toml" # an explicit empty config: an osv-scanner.toml in the repository is never read
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --config "$RUNNER_TEMP/osv-scanner-empty.toml" --lockfile package-lock.json --format json --output-file "$RUNNER_TEMP/osv-results.json"
          scanner_exit=$?
          set -e
          node ../templates/service/.github/scripts/dependency-audit.cjs --results "$RUNNER_TEMP/osv-results.json" --accepted ../.github/dependency-audit-accepted.json --scanner-exit "$scanner_exit"
      - name: Token Budget Guardrail (BASE-024)
        run: node dist/index.js ai stats --max-tokens 5000 --ci --root .. >> "$GITHUB_STEP_SUMMARY"
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: "Notificar en Slack: Fallo de CI"
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: node ../.github/scripts/slack-notify.js ci_failure

  # BASE-071-P3 D3: each task directory the PR changes must keep transitions[] append-only (A1) and pass
  # pipeline check and pipeline debt. It runs on every PR and exits 0 when no task directory changed, so it can be required.
  task-dirs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install and build the CLI
        working-directory: cli
        run: npm ci && npm run build
      - name: Task directories changed by the PR (pipeline ci)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node cli/dist/index.js pipeline ci --base "$BASE_SHA" --root .
      - name: "Notificar en Slack: Fallo de CI"
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: node .github/scripts/slack-notify.js ci_failure

  # BASE-071-P3 D3b (H7): the PR is ready for human review only when both cli and task-dirs pass.
  notify-ready:
    needs: [cli, task-dirs]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
      - name: "Notificar en Slack: PR listo para aprobación humana"
        if: env.SLACK_WEBHOOK_URL != ''
        run: node .github/scripts/slack-notify.js pr_ready_for_review
