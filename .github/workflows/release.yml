name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Run test suite
        working-directory: cli
        run: npm test

      - name: Verify AI artefacts are in sync with .ai/
        working-directory: cli
        run: node dist/index.js doctor --root ..

      - name: Package ships every referenced file (BASE-046-D1)
        working-directory: cli
        run: npm run check:package

      - name: Check release version
        id: versioning
        run: |
          PKG_NAME=$(node -p "require('./cli/package.json').name")
          # Fail fast on a registry error: a fallback version would let an unbumped release reach npm publish.
          if ! REMOTE_VER=$(npm view "$PKG_NAME" version 2>"$RUNNER_TEMP/npm-view.err"); then
            if grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              REMOTE_VER="0.0.0" # never published: any version is greater
            else
              echo "::error::npm view $PKG_NAME failed; cannot compare versions. $(head -c 300 "$RUNNER_TEMP/npm-view.err")"
              exit 1
            fi
          fi
          LAST_TAG="v$REMOTE_VER"
          echo "Published on npm: $REMOTE_VER (last tag: $LAST_TAG)"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            LOG=$(git log "$LAST_TAG..HEAD" --oneline)
          else
            LOG=$(git log -n 10 --oneline)
          fi

          LOCAL_VER=$(node -p "require('./cli/package.json').version")

          if [ -z "$LOG" ] && [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            echo "No new commits or version changes since last release ($LAST_TAG). Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The version is set in the release PR (BASE-080-G1): the branch ruleset blocks any bot push to main,
          # so CI never bumps it. Numeric major.minor.patch comparison, no dependency.
          if ! node -e 'const p=v=>v.split(".").map(Number);const[a,b]=[p(process.argv[1]),p(process.argv[2])];for(let i=0;i<3;i++){if(a[i]!==b[i])process.exit(a[i]>b[i]?0:1)}process.exit(1)' "$LOCAL_VER" "$REMOTE_VER"; then
            echo "::error::cli/package.json version $LOCAL_VER is not greater than published $REMOTE_VER. Bump cli/package.json and cli/package-lock.json in a ticketed PR to development before the release PR."
            exit 1
          fi

          echo "Releasing version from package.json: $LOCAL_VER"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$LOCAL_VER" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with Provenance
        if: steps.versioning.outputs.should_publish == 'true'
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create Git Tag and GitHub Release
        if: steps.versioning.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="v${{ steps.versioning.outputs.new_version }}"
          if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            gh release create "$NEW_TAG" --generate-notes --title "$NEW_TAG"
          fi

      - name: Notificar release en Slack
        if: steps.versioning.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.versioning.outputs.new_version }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node .github/scripts/slack-notify.js release_published
