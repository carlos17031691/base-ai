name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Run test suite
        working-directory: cli
        run: npm test

      - name: Verify AI artefacts are in sync with .ai/
        working-directory: cli
        run: node dist/index.js doctor --root ..

      - name: Calculate and bump next version automatically
        id: versioning
        run: |
          PKG_NAME=$(node -p "require('./cli/package.json').name")
          REMOTE_VER=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.1.0")
          LAST_TAG="v$REMOTE_VER"
          echo "Published npm version: $REMOTE_VER (last tag: $LAST_TAG)"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            LOG=$(git log "$LAST_TAG..HEAD" --oneline)
          else
            LOG=$(git log -n 10 --oneline)
          fi

          LOCAL_VER=$(node -p "require('./cli/package.json').version")

          if [ -z "$LOG" ] && [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            echo "No new commits or version changes since last release ($LAST_TAG). Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$LOG" | grep -qE "BREAKING CHANGE|!:"; then
            BUMP="major"
          elif echo "$LOG" | grep -qE "feat(\(.*\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          echo "Determined bump type: $BUMP"
          cd cli
          if [ "$LOCAL_VER" != "$REMOTE_VER" ]; then
            NEW_VER="$LOCAL_VER"
            echo "Using manual version from package.json: $NEW_VER"
          else
            NEW_VER=$(npm version "$BUMP" --no-git-tag-version)
            NEW_VER="${NEW_VER#v}"
            echo "Auto-bumped version to: $NEW_VER"
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with Provenance
        if: steps.versioning.outputs.should_publish == 'true'
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create Git Tag, GitHub Release and push version bump
        if: steps.versioning.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="v${{ steps.versioning.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            gh release create "$NEW_TAG" --generate-notes --title "$NEW_TAG"
          fi

          git add cli/package.json cli/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.versioning.outputs.new_version }} [skip ci]"
            git push origin main
            git push origin main:development || true
          fi

      - name: Notificar release en Slack
        if: steps.versioning.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.versioning.outputs.new_version }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node .github/scripts/slack-notify.js release_published
