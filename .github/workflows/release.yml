name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Verify AI artefacts are in sync with .ai/
        run: node dist/index.js doctor --root ..

      - name: Check if version in package.json is already published
        id: check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view "$PKG_NAME" version 2>/dev/null || echo "none")
          echo "Package: $PKG_NAME | Local version: $LOCAL_VER | Published version: $REMOTE_VER"
          if [ "$LOCAL_VER" != "$REMOTE_VER" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VER" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with Provenance
        if: steps.check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create Git Tag & GitHub Release
        if: steps.check.outputs.should_publish == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
